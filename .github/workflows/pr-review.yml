# Auto-review opened/updated PRs via ai-workflows.
# Registered consumer: lenaxia/AI-or-Not (see ai-workflows/consumers/ai-or-not.yaml).

name: PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  id-token: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    # Skip bots — release-please creates PRs as github-actions[bot], which
    # has no write access. The opencode action rejects non-write actors.
    # Bot PRs are auto-generated version bumps that don't need AI review.
    if: |
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'release-please[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    uses: lenaxia/ai-workflows/.github/workflows/pr-review.yml@v0.2.7
    secrets: inherit
    with:
      version: v0.2.7
      project_name: AI-or-Not
