# Auto-review opened/updated PRs via ai-workflows.
# Registered consumer: lenaxia/AI-or-Not (see ai-workflows/consumers/ai-or-not.yaml).

name: PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  id-token: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.user.login != 'renovate[bot]'
    uses: lenaxia/ai-workflows/.github/workflows/pr-review.yml@v0.2.15
    secrets: inherit
    with:
      version: v0.2.15
      project_name: AI-or-Not
