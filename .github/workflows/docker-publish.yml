# Build & publish the Docker image when a version release is published.
#
# Triggers:
#   - release published  (created automatically by release-please)
#   - workflow_dispatch  (manual rebuild of HEAD as :main)
#
# Why `release` not `push: tags:`: release-please creates the release using
# GITHUB_TOKEN. Per GitHub's anti-recursion rule, events triggered by
# GITHUB_TOKEN do not fire other workflows — so the tag push from
# release-please does NOT trigger this workflow. The `release` event fires
# regardless of which token created the release, which is what we need.
#
# Pushes to ghcr.io/lenaxia/ai-or-not (GHCR lowercases org/repo) with tags:
#   :vX.Y.Z       (exact version, immutable)
#   :vX.Y          (latest patch series)
#   :vX            (latest minor series)
#   :latest        (most recent release on the default branch)
#   :sha-<short>   (git short SHA, for traceability)

name: Publish Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to build (defaults to default branch)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Skip draft releases and prereleases (we only publish GA semver).
    if: ${{ github.event_name != 'release' || github.event.release.draft == false }}
    steps:
      - name: Resolve ref to build
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "ref=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.ref }}" ]; then
            echo "ref=${{ github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse semver tag into variants
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # On release events, use the release's tag_name. On workflow_dispatch,
          # default to :main (manual rebuild) unless a ref input was given.
          tags: |
            ${{ steps.ref.outputs.is_release == 'true' && 'type=match,pattern=v(.*),group=1' || '' }}
            ${{ steps.ref.outputs.is_release == 'true' && 'type=match,pattern=v(\d.\d.\d),group=1' || '' }}
            ${{ steps.ref.outputs.is_release == 'true' && 'type=match,pattern=v(\d.\d),group=1' || '' }}
            ${{ steps.ref.outputs.is_release == 'true' && 'type=match,pattern=v(\d),group=1' || '' }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ steps.ref.outputs.is_release == 'true' }}
            type=raw,value=main,enable=${{ steps.ref.outputs.is_release != 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
