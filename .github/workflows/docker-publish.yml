# Build & publish the Docker image.
#
# Triggers:
#   - workflow_call      (from release.yml when release-please creates a release)
#   - workflow_dispatch  (manual rebuild of HEAD or arbitrary ref)
#
# Why not push: tags / release: published triggers: release-please creates
# both using GITHUB_TOKEN. Per GitHub's anti-recursion rule, events
# triggered by GITHUB_TOKEN do not fire other workflows — so neither the
# tag push nor the release-published event reaches this workflow. Calling
# it directly from release.yml (workflow_call) bypasses the rule.
#
# Pushes to ghcr.io/lenaxia/ai-or-not (GHCR lowercases org/repo) with tags:
#   :vX.Y.Z       (exact version, immutable)
#   :vX.Y          (latest patch series)
#   :vX            (latest minor series)
#   :latest        (most recent release on the default branch)
#   :sha-<short>   (git short SHA, for traceability)

name: Publish Docker image

on:
  workflow_call:
    inputs:
      ref:
        description: "Tag or branch to build (defaults to default branch)"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to build (defaults to default branch)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve ref to build
        id: ref
        run: |
          if [ -n "${{ inputs.ref }}" ]; then
            REF="${{ inputs.ref }}"
            echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          else
            REF="${{ github.ref_name }}"
            echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          fi
          # A release tag looks like vX.Y.Z — flag it for the :latest tag.
          if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from ref
        id: ver
        run: |
          REF="${{ steps.ref.outputs.ref }}"
          if [[ "$REF" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            echo "full=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
            echo "minor=${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"
            echo "major=${MAJOR}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Parse semver tag into variants
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # type=match reads GITHUB_REF, which is refs/heads/main in a
          # workflow_call — not the tag we're building. Use type=raw with
          # the version extracted above instead.
          tags: |
            type=raw,value=${{ steps.ver.outputs.full }},enable=${{ steps.ver.outputs.is_release == 'true' }}
            type=raw,value=${{ steps.ver.outputs.minor }},enable=${{ steps.ver.outputs.is_release == 'true' }}
            type=raw,value=${{ steps.ver.outputs.major }},enable=${{ steps.ver.outputs.is_release == 'true' }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ steps.ver.outputs.is_release == 'true' }}
            type=raw,value=main,enable=${{ steps.ver.outputs.is_release != 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
